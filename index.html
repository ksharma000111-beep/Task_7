<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="todo-card">

            <h1>My To-Do List 📝</h1>

            <p class="subtitle">Organize your day, one task at a time!</p>


            <div class="input-section">

                <input type="text" id="taskInput" placeholder="Enter your task...">

                <button id="addBtn">+ Add Task</button>

            </div>


            <p id="errorMessage"></p>


            <div class="task-info">
                <span>Total Tasks: <span id="totalTasks">0</span></span>
                <span>Completed: <span id="completedTasks">0</span></span>
            </div>


            <ul id="taskList"></ul>

            <p id="emptyMessage">No tasks yet. Add your first task! 🎯</p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
